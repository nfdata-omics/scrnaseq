name: convert_mudata
description: Combine GEX, VDJ, metadata, and demultiplexing results in a MuData object.
keywords: [single-cell, mudata, multimodal]
tools:
  - muon:
      description: Multimodal omics analysis framework.
      homepage: https://muon.readthedocs.io/
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Groovy map containing GEX metadata.
    - input_h5ad:
        type: file
        description: Input GEX AnnData object.
  - - meta2:
        type: map
        description: Groovy map containing VDJ metadata.
    - input_vdj:
        type: file
        description: Input VDJ AnnData object.
  - - meta3:
        type: map
        description: Groovy map containing demultiplexing metadata.
    - demultiplexing_doublets:
        type: file
        description: Demultiplexing and doublet annotations.
  - metadata_file:
      type: file
      description: Additional sample metadata.
output:
  h5mu:
    - - meta:
          type: map
          description: Groovy map containing sample information.
      - "*.mudata.h5mu":
          type: file
          description: Combined MuData object.
  versions:
    - versions.yml:
        type: file
        description: Software versions.
authors: ["@nfdata-omics"]
maintainers: ["@nfdata-omics"]
