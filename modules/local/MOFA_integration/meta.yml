name: mofa_integration
description: Integrate gene-expression and chromatin-accessibility modalities with MOFA.
keywords: [single-cell, multi-omics, mofa, integration]
tools:
  - mofapy2:
      description: Multi-Omics Factor Analysis framework.
      homepage: https://biofam.github.io/MOFA2/
      licence: ["LGPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: Groovy map containing GEX metadata.
    - input_h5mu:
        type: file
        description: Input gene-expression MuData object.
  - - meta2:
        type: map
        description: Groovy map containing ATAC metadata.
    - input_h5ad_atac:
        type: file
        description: Input ATAC AnnData object.
output:
  h5mu:
    - - meta:
          type: map
          description: Groovy map containing sample information.
      - "*.mofa.h5mu":
          type: file
          description: MOFA-integrated MuData object.
  umap_mofa:
    - umap_mofa.png:
        type: file
        description: MOFA UMAP plot.
  versions:
    - versions.yml:
        type: file
        description: Software versions.
authors: ["@nfdata-omics"]
maintainers: ["@nfdata-omics"]
