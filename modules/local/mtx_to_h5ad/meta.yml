name: mtx_to_h5ad
description: Convert Cell Ranger H5 or MEX matrices into AnnData H5AD files.
keywords: [single-cell, matrix, anndata, h5ad]
tools:
  - scanpy:
      description: Single-cell analysis toolkit.
      homepage: https://scanpy.readthedocs.io/
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Groovy map containing matrix metadata.
    - matrix_paths:
        type: file
        description: H5 matrix or complete MEX directory. Legacy aligner outputs may contain both representations.
output:
  h5ad:
    - - meta:
          type: map
          description: Groovy map containing matrix metadata.
      - "${meta.id}_${meta.input_type}_matrix.h5ad":
          type: file
          description: Converted AnnData matrix.
  versions:
    - versions.yml:
        type: file
        description: Software versions.
authors: ["@nfdata-omics"]
maintainers: ["@nfdata-omics"]
